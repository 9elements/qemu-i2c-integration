version: '3'

vars:
  QEMU_DIR: qemu
  BUILDROOT_DIR: buildroot
  BR2_EXTERNAL_PATH: "{{.ROOT_DIR}}/br2-external"
  BUILDROOT_OUTPUT: "{{.BUILDROOT_DIR}}/output"
  DEFCONFIG: aspeed_ast2600evb_i2c_defconfig

tasks:
  init-submodules:
    desc: Initialize git submodules with depth 1
    cmds:
      - git submodule update --init --depth 1
    status:
      - test -f {{.QEMU_DIR}}/README.rst
      - test -f {{.BUILDROOT_DIR}}/README

  build-qemu:
    desc: Build QEMU (qemu-system-arm only)
    dir: "{{.QEMU_DIR}}"
    cmds:
      - mkdir -p build
      - |
        cd build
        ../configure --target-list=arm-softmmu
      - make -C build -j$(nproc)
    sources:
      - "{{.QEMU_DIR}}/**/*.c"
      - "{{.QEMU_DIR}}/**/*.h"
    generates:
      - "{{.QEMU_DIR}}/build/qemu-system-arm"
    deps:
      - init-submodules

  build-buildroot:
    desc: Build Buildroot with BR2_EXTERNAL and custom defconfig
    dir: "{{.BUILDROOT_DIR}}"
    cmds:
      - make BR2_EXTERNAL={{.BR2_EXTERNAL_PATH}} {{.DEFCONFIG}}
      - make BR2_EXTERNAL={{.BR2_EXTERNAL_PATH}} -j$(nproc)
    generates:
      - "{{.BUILDROOT_OUTPUT}}/images/zImage"
      - "{{.BUILDROOT_OUTPUT}}/images/rootfs.cpio"
      - "{{.BUILDROOT_OUTPUT}}/images/aspeed-ast2600-evb-nmi.dtb"
    deps:
      - init-submodules
    preconditions:
      - test -d {{.BR2_EXTERNAL_PATH}}
      - test -f {{.BR2_EXTERNAL_PATH}}/external.desc
      - test -f {{.BR2_EXTERNAL_PATH}}/configs/{{.DEFCONFIG}}

  run-qemu:
    desc: Run QEMU with Buildroot images for AST2600 EVB
    cmds:
      - |
        {{.QEMU_DIR}}/build/qemu-system-arm \
          -M ast2600-evb \
          -nographic \
          -kernel {{.BUILDROOT_OUTPUT}}/images/zImage \
          -initrd {{.BUILDROOT_OUTPUT}}/images/rootfs.cpio \
          -dtb {{.BUILDROOT_OUTPUT}}/images/aspeed-ast2600-evb-nmi.dtb \
          -chardev socket,path=vi2c_bus.sock,id=vi2c_bus1,server=on,wait=off \
          -device chardev-i2c,bus=aspeed.i2c.bus.1,chardev=vi2c_bus1,address=0x20 \
          -chardev socket,path=vi2c_bus.sock,id=vi2c_bus2,server=off \
          -device chardev-i2c,bus=aspeed.i2c.bus.2,chardev=vi2c_bus2,address=0x10
    deps:
      - build-qemu
      - build-buildroot
    preconditions:
      - test -f {{.QEMU_DIR}}/build/qemu-system-arm
      - test -f {{.BUILDROOT_OUTPUT}}/images/zImage
      - test -f {{.BUILDROOT_OUTPUT}}/images/rootfs.cpio
      - test -f {{.BUILDROOT_OUTPUT}}/images/aspeed-ast2600-evb-nmi.dtb

  clean-qemu:
    desc: Clean QEMU build artifacts
    dir: "{{.QEMU_DIR}}"
    cmds:
      - rm -rf build

  clean-buildroot:
    desc: Clean Buildroot build artifacts
    dir: "{{.BUILDROOT_DIR}}"
    cmds:
      - make clean

  clean:
    desc: Clean all build artifacts
    cmds:
      - task: clean-qemu
      - task: clean-buildroot
